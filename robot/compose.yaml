services:
  lidar:
    image: sentinel-ros:jazzy
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=0
    devices:
      - /dev/ldlidar:/dev/ldlidar
    group_add:
      - dialout
    command: >
      ros2 run ldlidar_stl_ros2 ldlidar_stl_ros2_node --ros-args
      -p product_name:=LDLiDAR_LD19 -p topic_name:=scan -p frame_id:=laser
      -p port_name:=/dev/ldlidar -p port_baudrate:=230400 -p laser_scan_dir:=true
      -p enable_angle_crop_func:=false -p angle_crop_min:=135.0 -p angle_crop_max:=225.0
  foxglove:
    image: sentinel-ros:jazzy
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=0
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
  rosbridge:
    image: sentinel-ros:jazzy
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=0
    # Port 9090 is taken by Cockpit (Pi2's web admin), so rosbridge uses 9091.
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9091
